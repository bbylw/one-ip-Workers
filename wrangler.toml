# Single Worker deployment: no [assets] binding. `pnpm build` embeds dist/ into
# public/worker/assets.generated.js, so `wrangler deploy` publishes the whole site.
name = "one-ip"
main = "public/worker/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

[observability.traces]
enabled = false

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
